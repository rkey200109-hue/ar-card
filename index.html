<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MetaScan AR</title>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
  <style>
    html,body,#camera { margin:0;width:100%;height:100%;overflow:hidden; }
    body { background:#070913; color:white;font:16px system-ui,sans-serif; }
    #camera { position:relative;isolation:isolate; }
    #message { position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
      text-align:center;padding:12px;border-radius:14px;background:rgba(0,0,0,.68);line-height:1.4; }
    #retry { margin:8px auto 0;padding:11px 20px;border:0;border-radius:10px;background:#1766de;color:white;font:600 16px system-ui; }
  </style>
</head>
<body>
  <div id="camera" aria-label="Camera view"></div>
  <div id="message" role="status" aria-live="polite"><span id="status">Opening camera. Please allow camera access.</span><br><button id="retry" type="button" hidden>Try again</button></div>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container=document.querySelector('#camera');
    const message=document.querySelector('#message');
    const status=document.querySelector('#status');
    const retry=document.querySelector('#retry');
    const ar=new MindARThree({container,imageTargetSrc:'./targets.mind',uiLoading:'no',uiScanning:'no',uiError:'no'});
    const {renderer,scene,camera}=ar;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.domElement.style.zIndex='1';
    ar.cssRenderer.domElement.style.zIndex='2';
    ar.cssRenderer.domElement.style.pointerEvents='none';
    scene.add(new THREE.HemisphereLight(0xffffff,0x8b93a8,2.1));
    const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(1,2,3);scene.add(key);
    const anchor=ar.addAnchor(0);
    const content=new THREE.Group();anchor.group.add(content);
    let ready=false, found=false, running=false, starting=false;
    function updateGuide() {
      message.hidden=ready && found;
      if (!found && running) status.textContent=ready?'Point at the whole printed QR code.':'Loading character…';
    }
    anchor.onTargetFound=()=>{found=true;updateGuide();};
    anchor.onTargetLost=()=>{found=false;updateGuide();};
    new GLTFLoader().load('./model-card-solid.glb',({scene:model})=>{
      // The model is 0.127 m tall.  Scale relative to MindAR's one-card-wide units.
      model.scale.setScalar(8.0);
      model.rotation.x=Math.PI/2;
      model.position.set(-.20,0,.003);
      content.add(model);ready=true;updateGuide();
    },undefined,()=>{status.textContent='The model could not load. Check your connection and reload.';message.hidden=false;});
    async function start() {
      if(starting||running)return;
      starting=true;retry.hidden=true;status.textContent='Opening camera. Please allow camera access.';
      try {
        const promise=ar.start();
        if(ar.video)ar.video.style.zIndex='0';
        await promise;
        running=true;
        renderer.setAnimationLoop(()=>renderer.render(scene,camera));
        updateGuide();
      } catch(error) {
        console.error('Unable to start camera',error);
        status.textContent='Camera unavailable. Allow camera access in Safari settings, then try again.';
        retry.hidden=false;
      } finally {starting=false;}
    }
    retry.addEventListener('click',()=>location.reload());
    window.addEventListener('pagehide',()=>{if(running){renderer.setAnimationLoop(null);try{ar.stop();}catch(e){console.error(e);}running=false;}});
    window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
    start();
  </script>
</body>
</html>
