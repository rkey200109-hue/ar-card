<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070913"><title>MetaScan AR</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
<style>
html,body,#camera{margin:0;width:100%;height:100%;overflow:hidden}body{background:#090d19;color:#fff;font:15px system-ui,-apple-system,sans-serif}#camera{position:relative;isolation:isolate}#status{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#000c;border-radius:12px;padding:12px;text-align:center;line-height:1.4}#actions{position:fixed;z-index:6;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:10px}#hint{margin:0;max-width:400px;background:#000c;border-radius:10px;padding:10px 14px;text-align:center}a,button{border:0;border-radius:12px;background:#145ed2;color:white;padding:15px 20px;font:700 16px system-ui;text-decoration:none;text-align:center}#native img{position:absolute;width:1px;height:1px;opacity:.01}#native::after{content:'Place Model in Room (360° AR)'}#restart{font-size:14px;padding:8px 14px;background:#354261}#android[hidden],#native[hidden],#restart[hidden]{display:none}
</style></head><body>
<div id="camera" aria-label="Card scanner camera"></div>
<div id="status" role="status" aria-live="polite">Opening camera. Allow camera access, then point at your card.</div>
<div id="actions"><p id="hint">Tap Place Model in Room to view the character in your space and walk around it.</p>
<a id="native" rel="ar" href="./character.usdz#allowsContentScaling=1" aria-label="Place Model in Room, 360 degree AR"><img src="../../random-featured.png" alt=""></a>
<a id="android" href="./android-ar.html" hidden>Place Model in Room (360° AR)</a>
<button id="restart" type="button" hidden>Restart camera</button></div>
<script type="module">
import * as THREE from 'three';
import {MindARThree} from 'mindar-image-three';
const status=document.querySelector('#status'),native=document.querySelector('#native'),android=document.querySelector('#android'),restart=document.querySelector('#restart');
const isAndroid=/Android/i.test(navigator.userAgent);if(isAndroid){native.hidden=true;android.hidden=false}
const ar=new MindARThree({container:document.querySelector('#camera'),imageTargetSrc:'./targets-vio.mind',maxTrack:1,missTolerance:3,warmupTolerance:1,uiLoading:'no',uiScanning:'no',uiError:'no'});
const {renderer,scene,camera}=ar;
renderer.domElement.style.zIndex='1';ar.cssRenderer.domElement.style.zIndex='2';ar.cssRenderer.domElement.style.pointerEvents='none';
let running=false,found=-1;
const anchors=[0,1,2,3].map(i=>ar.addAnchor(i));
const outlineGeometry=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.5,-.5,.003),new THREE.Vector3(.5,-.5,.003),new THREE.Vector3(.5,.5,.003),new THREE.Vector3(-.5,.5,.003)]);
anchors.forEach((anchor,i)=>{
 const outline=new THREE.LineLoop(outlineGeometry,new THREE.LineBasicMaterial({color:0x42dcff,depthTest:false}));anchor.group.add(outline);
 anchor.onTargetFound=()=>{found=i;status.textContent='Card found. Tap Place Model in Room to open AR.'};
 anchor.onTargetLost=()=>{if(found===i){found=-1;status.textContent='Point at your card, or tap Place Model in Room to continue.'}};
});
if(new URLSearchParams(location.search).has('debug'))window.__scannerDebug={get target(){return found},get running(){return running}};
function stopScanner(){if(!running)return;renderer.setAnimationLoop(null);try{ar.stop()}catch(e){console.warn('Camera shutdown:',e)}running=false}
native.addEventListener('click',()=>{stopScanner();status.textContent='Opening Apple AR. When you return, tap Restart camera to scan again.';restart.hidden=false});
restart.addEventListener('click',()=>location.reload());
window.addEventListener('pagehide',stopScanner);
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
async function start(){try{await ar.start();ar.video.style.zIndex='0';running=true;renderer.setAnimationLoop(()=>renderer.render(scene,camera));status.textContent='Point at your card, or tap Place Model in Room to continue.'}catch(e){console.error(e);status.textContent='Camera unavailable. You can still tap Place Model in Room. For iPhone, open this page in Safari.';restart.hidden=false}}
start();
</script></body></html>
