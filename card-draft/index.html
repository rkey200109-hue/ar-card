<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MetaScan Card Tracking Draft</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
<style>html,body,#camera{margin:0;width:100%;height:100%;overflow:hidden}body{background:#070913;color:white;font:15px system-ui,sans-serif}#camera{position:relative;isolation:isolate;touch-action:none}#msg{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;padding:10px;border-radius:12px;background:#000b}#controls{position:fixed;z-index:11;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;justify-content:center}button,a{border:0;border-radius:12px;background:#155ed1;color:white;padding:12px 16px;font:600 15px system-ui;text-decoration:none}#retry{margin:8px auto 0}#info{position:fixed;z-index:10;bottom:75px;left:16px;right:16px;background:#000b;text-align:center;padding:9px;border-radius:10px;font-size:13px}</style></head><body>
<div id="camera" aria-label="Camera view"></div><div id="msg" role="status"><span id="status">Opening camera. Allow camera access.</span><br><button id="retry" hidden>Try again</button></div>
<div id="info">Card-tracking draft: keep the QR visible. Drag, pinch, or twist with two fingers.</div>
<div id="controls"><button id="next" aria-label="Choose another model">↻ Another model</button><a href="../">Surface AR</a></div>
<script type="module">
import * as THREE from 'three';import {MindARThree} from 'mindar-image-three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const container=document.querySelector('#camera'),msg=document.querySelector('#msg'),status=document.querySelector('#status'),retry=document.querySelector('#retry');
const ar=new MindARThree({container,imageTargetSrc:'./targets.mind',uiLoading:'no',uiScanning:'no',uiError:'no'}),{renderer,scene,camera}=ar;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.zIndex='1';ar.cssRenderer.domElement.style.zIndex='2';ar.cssRenderer.domElement.style.pointerEvents='none';
scene.add(new THREE.HemisphereLight(0xffffff,0x888899,2));const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(1,2,3);scene.add(light);
const anchor=ar.addAnchor(0),rig=new THREE.Group();anchor.group.add(rig);const loader=new GLTFLoader(),clock=new THREE.Clock();let mixer=null, model=null,found=false,running=false,loading=false,generation=0;
const choices=[{name:'Dog',path:'model.glb'},{name:'MetaScan character',path:'featured.glb'},{name:'Meta twin',path:'twin.glb'},{name:'Animated character',path:'animated.glb'}];let selected=0;
function guide(){msg.hidden=found&&!loading;if(!found&&running)status.textContent='Point at the complete printed QR code.';else if(loading)status.textContent='Loading '+choices[selected].name+'…';}
anchor.onTargetFound=()=>{found=true;guide()};anchor.onTargetLost=()=>{found=false;guide()};
function dispose(root){root.traverse(o=>{if(o.isMesh){o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(!m)continue;for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose();}}});}
function load(index){selected=index;loading=true;const version=++generation;guide();loader.load(choices[index].path,gltf=>{if(version!==generation){dispose(gltf.scene);return}if(mixer)mixer.stopAllAction();if(model){rig.remove(model);dispose(model)}model=gltf.scene;
// Measure each model in its glTF Y-up coordinates. The tracked card is one
// unit wide; after rotating, model up becomes the card-normal (+Z).
model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model,true);const height=bounds.max.y-bounds.min.y;
if(!Number.isFinite(height)||height<.00001){loading=false;msg.hidden=false;status.textContent='Model size could not be measured. Choose another model.';return}
const scale=.85/height;model.scale.setScalar(scale);model.rotation.x=Math.PI/2;model.position.z=.003-bounds.min.y*scale;
rig.position.set(0,0,0);rig.rotation.set(0,0,0);rig.scale.setScalar(1);rig.add(model);mixer=gltf.animations.length?new THREE.AnimationMixer(model):null;if(mixer)gltf.animations.forEach(a=>mixer.clipAction(a).play());loading=false;guide()},undefined,()=>{if(version!==generation)return;loading=false;msg.hidden=false;status.textContent='Model could not load. Check your connection and tap ↻.'});}
document.querySelector('#next').addEventListener('click',()=>{let n=Math.floor(Math.random()*(choices.length-1));if(n>=selected)n++;load(n)});
const touches=new Map();let previousDistance=0,previousAngle=0;
function distance(){const a=[...touches.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}
function angle(){const a=[...touches.values()];return a.length===2?Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x):0}
container.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});container.setPointerCapture(e.pointerId);previousDistance=distance();previousAngle=angle()});
container.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const last=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!found)return;if(touches.size===1){rig.position.x+=(e.clientX-last.x)/container.clientWidth;rig.position.y-=(e.clientY-last.y)/container.clientHeight}else if(touches.size===2){const d=distance(),a=angle();if(previousDistance>0){const scale=THREE.MathUtils.clamp(rig.scale.x*d/previousDistance,.4,4);rig.scale.setScalar(scale);rig.rotation.z-=Math.atan2(Math.sin(a-previousAngle),Math.cos(a-previousAngle))}previousDistance=d;previousAngle=a}});
function release(e){touches.delete(e.pointerId);previousDistance=distance();previousAngle=angle()}container.addEventListener('pointerup',release);container.addEventListener('pointercancel',release);
async function start(){try{const promise=ar.start();if(ar.video)ar.video.style.zIndex='0';await promise;running=true;renderer.setAnimationLoop(()=>{const delta=clock.getDelta();if(mixer)mixer.update(delta);renderer.render(scene,camera)});guide()}catch(e){console.error(e);status.textContent='Camera unavailable. Allow access in Safari and retry.';retry.hidden=false}}
retry.addEventListener('click',()=>location.reload());window.addEventListener('pagehide',()=>{if(running){renderer.setAnimationLoop(null);try{ar.stop()}catch(e){}running=false}});window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});load(0);start();
</script></body></html>
