<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070913"><title>MetaScan AR</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
<style>html,body,#camera{margin:0;width:100%;height:100%;overflow:hidden}body{background:#070913;color:white;font:15px system-ui,sans-serif}#camera{position:relative;isolation:isolate;touch-action:none}#statusBox{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;padding:11px;border-radius:12px;background:#000b;line-height:1.4}#tools{position:fixed;z-index:11;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;justify-content:center}button,a{border:0;border-radius:12px;background:#155ed1;color:white;padding:12px 16px;font:600 15px system-ui;text-decoration:none}#retry{margin:8px auto 0}#hint{position:fixed;z-index:10;bottom:75px;left:16px;right:16px;background:#000b;text-align:center;padding:9px;border-radius:10px;font-size:13px}</style></head><body>
<div id="camera" aria-label="Camera view"></div><div id="statusBox" role="status" aria-live="polite"><span id="status">Opening camera. Allow camera access.</span><br><button id="retry" hidden>Try again</button></div>
<div id="hint">Keep the card visible. Drag, pinch, or twist with two fingers.</div>
<div id="tools"><button id="next" type="button" aria-label="Choose another model">↻ Another model</button><a href="../">Surface AR</a></div>
<script type="module">
import * as THREE from 'three';import {MindARThree} from 'mindar-image-three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const container=document.querySelector('#camera'),statusBox=document.querySelector('#statusBox'),status=document.querySelector('#status'),retry=document.querySelector('#retry');
const ar=new MindARThree({container,imageTargetSrc:'./targets-v3.mind',maxTrack:1,missTolerance:0,warmupTolerance:1,uiLoading:'no',uiScanning:'no',uiError:'no'}),{renderer,scene,camera}=ar;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.zIndex='1';ar.cssRenderer.domElement.style.zIndex='2';ar.cssRenderer.domElement.style.pointerEvents='none';
scene.add(new THREE.HemisphereLight(0xffffff,0x888899,2));const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(1,2,3);scene.add(light);
// MindAR hides its own anchors on loss. A separate root holds the last usable
// anchor matrix in scene/camera coordinates; it is not a world-tracking pose.
const poseRoot=new THREE.Group(),rig=new THREE.Group();poseRoot.visible=false;scene.add(poseRoot);poseRoot.add(rig);
const anchors=[ar.addAnchor(0),ar.addAnchor(1),ar.addAnchor(2)];
const choices=[{name:'MetaScan character',path:'hand-scene.glb'},{name:'Dog',path:'model.glb'},{name:'Meta twin',path:'twin.glb'},{name:'Animated character',path:'animated.glb'}];
const loader=new GLTFLoader(),clock=new THREE.Clock(),desiredPosition=new THREE.Vector3(),desiredRotation=new THREE.Quaternion(),desiredScale=new THREE.Vector3();
let selected=0,model=null,modelBounds=null,mixer=null,loading=false,generation=0,running=false,hasPose=false,activeTarget=-1,trackingState='SEARCHING';
const debugEvents=[];
// MindAR already filters its measurements. This second, time-based filter
// operates on translation and unit quaternions, never on matrix components.
const alpha=(cutoff,dt)=>1/(1+1/(2*Math.PI*cutoff*dt));
const prevRaw=new THREE.Vector3(),velocity=new THREE.Vector3(),rawVelocity=new THREE.Vector3();
const prevQuat=new THREE.Quaternion(),relativeQuat=new THREE.Quaternion(),predictedQuat=new THREE.Quaternion(),identityQuat=new THREE.Quaternion();
let lastSample=0,lossTime=0,angularSpeed=0,angularAxis=new THREE.Vector3(0,0,1),lossPosition=new THREE.Vector3(),lossRotation=new THREE.Quaternion(),lossVelocity=new THREE.Vector3(),lossAngular=0,materials=[];
function setOpacity(amount){for(const item of materials){const transparent=amount<.999||item.transparent;item.mat.opacity=item.opacity*amount;if(item.mat.transparent!==transparent){item.mat.transparent=transparent;item.mat.needsUpdate=true}item.mat.depthWrite=amount<.999?false:item.depthWrite}}
function samplePose(now,reset){
 if(reset||!lastSample||now-lastSample>500){prevRaw.copy(desiredPosition);prevQuat.copy(desiredRotation);velocity.set(0,0,0);angularSpeed=0;lastSample=now;return}
 const dt=THREE.MathUtils.clamp((now-lastSample)/1000,.001,.25);lastSample=now;
 rawVelocity.copy(desiredPosition).sub(prevRaw).divideScalar(dt);prevRaw.copy(desiredPosition);
 // Marker units vary with the compiled target. Bound prediction relative to marker width.
 rawVelocity.clampLength(0,Math.max(.001,Math.abs(desiredScale.x))*4);velocity.lerp(rawVelocity,alpha(1,dt));
 relativeQuat.copy(prevQuat).invert().multiply(desiredRotation).normalize();prevQuat.copy(desiredRotation);
 if(relativeQuat.w<0)relativeQuat.set(-relativeQuat.x,-relativeQuat.y,-relativeQuat.z,-relativeQuat.w);
 const half=Math.acos(THREE.MathUtils.clamp(relativeQuat.w,-1,1)),s=Math.sin(half);
 if(s>.0001){angularAxis.set(relativeQuat.x/s,relativeQuat.y/s,relativeQuat.z/s).normalize();angularSpeed=THREE.MathUtils.lerp(angularSpeed,Math.min(2*half/dt,Math.PI*2),alpha(1,dt))}else angularSpeed*=1-alpha(1,dt);
}
function collectMaterials(){materials=[];const seen=new Set();if(!model)return;model.traverse(o=>{if(!o.isMesh)return;for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m&&!seen.has(m)){seen.add(m);materials.push({mat:m,opacity:m.opacity,transparent:m.transparent,depthWrite:m.depthWrite})}})}
function record(state){if(trackingState===state)return;trackingState=state;if(new URLSearchParams(location.search).has('debug')){debugEvents.push({state,time:performance.now(),visible:poseRoot.visible,target:activeTarget});if(debugEvents.length>100)debugEvents.shift()}}
if(new URLSearchParams(location.search).has('debug'))window.__metaScanDebug={get state(){return trackingState},get visible(){return poseRoot.visible},get target(){return activeTarget},get model(){return choices[selected].name},get position(){return poseRoot.position.toArray()},get meshCount(){let count=0;if(model)model.traverse(o=>{if(o.isMesh)count++});return count},get events(){return debugEvents.slice()}};
function setModelScale(){if(!model||!modelBounds)return;const target=activeTarget<0?poseRoot.userData.target:activeTarget;const markerRatio=target===2?3.0:2.5;const height=modelBounds.max.y-modelBounds.min.y;const factor=markerRatio/height;model.scale.setScalar(factor);model.rotation.x=Math.PI/2;model.position.z=.003-modelBounds.min.y*factor;}
function showStatus(){
 statusBox.hidden=false;
 if(loading){status.textContent='Loading '+choices[selected].name+'…';return}
 if(!running){status.textContent='Opening camera. Allow camera access.';return}
 if(!hasPose){status.textContent='Point at the complete printed card or QR code.';return}
 if(trackingState==='EXTRAPOLATING'||trackingState==='LOST'){status.textContent='Tracking paused. Point back at the card.';return}
 statusBox.hidden=true;
}
function receivePose(index){const anchor=anchors[index];if(!anchor.visible)return;
 const returning=trackingState!=='TRACKING',changed=poseRoot.userData.target!==index;
 activeTarget=index;anchor.group.matrix.decompose(desiredPosition,desiredRotation,desiredScale);samplePose(performance.now(),returning||changed);
 if(!hasPose){poseRoot.position.copy(desiredPosition);poseRoot.quaternion.copy(desiredRotation);poseRoot.scale.copy(desiredScale);hasPose=true;poseRoot.visible=true;setModelScale();}
 else if(poseRoot.userData.target!==index){setModelScale()}
 poseRoot.userData.target=index;poseRoot.visible=true;setOpacity(1);record('TRACKING');showStatus();
}
anchors.forEach((anchor,index)=>{
 anchor.onTargetFound=()=>{};
 anchor.onTargetUpdate=()=>{if(anchor.visible)receivePose(index)};
 anchor.onTargetLost=()=>{if(activeTarget===index){activeTarget=-1;lossTime=performance.now();lossPosition.copy(poseRoot.position);lossRotation.copy(poseRoot.quaternion);lossVelocity.copy(velocity);lossAngular=angularSpeed;record('EXTRAPOLATING');showStatus()}};
});
function dispose(root){root.traverse(o=>{if(o.isMesh){o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(!m)continue;for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose()}}});}
function load(index){selected=index;loading=true;const version=++generation;showStatus();loader.load(choices[index].path,gltf=>{
 if(version!==generation){dispose(gltf.scene);return}if(mixer)mixer.stopAllAction();if(model){rig.remove(model);dispose(model)}
 model=gltf.scene;model.updateMatrixWorld(true);modelBounds=new THREE.Box3().setFromObject(model,true);const height=modelBounds.max.y-modelBounds.min.y;
 if(!Number.isFinite(height)||height<.00001){loading=false;statusBox.hidden=false;status.textContent='Model size could not be measured. Choose another model.';return}
 rig.position.set(0,0,0);rig.rotation.set(0,0,0);rig.scale.setScalar(1);setModelScale();rig.add(model);collectMaterials();
 mixer=gltf.animations.length?new THREE.AnimationMixer(model):null;if(mixer)gltf.animations.forEach(a=>mixer.clipAction(a).play());loading=false;showStatus();
},undefined,()=>{if(version!==generation)return;loading=false;statusBox.hidden=false;status.textContent='Model could not load. Check your connection and tap ↻.'});}
document.querySelector('#next').addEventListener('click',()=>{let n=Math.floor(Math.random()*(choices.length-1));if(n>=selected)n++;load(n)});
const touches=new Map();let previousDistance=0,previousAngle=0;
function distance(){const a=[...touches.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}
function angle(){const a=[...touches.values()];return a.length===2?Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x):0}
container.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});container.setPointerCapture(e.pointerId);previousDistance=distance();previousAngle=angle()});
container.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const last=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!hasPose)return;if(touches.size===1){rig.position.x+=(e.clientX-last.x)/container.clientWidth;rig.position.y-=(e.clientY-last.y)/container.clientHeight}else if(touches.size===2){const d=distance(),a=angle();if(previousDistance>0){const scale=THREE.MathUtils.clamp(rig.scale.x*d/previousDistance,.2,12);rig.scale.setScalar(scale);rig.rotation.z-=Math.atan2(Math.sin(a-previousAngle),Math.cos(a-previousAngle))}previousDistance=d;previousAngle=a}});
function release(e){touches.delete(e.pointerId);previousDistance=distance();previousAngle=angle()}container.addEventListener('pointerup',release);container.addEventListener('pointercancel',release);
async function start(){try{const promise=ar.start();if(ar.video)ar.video.style.zIndex='0';await promise;running=true;renderer.setAnimationLoop(()=>{
 const delta=Math.min(clock.getDelta(),.1);
 if(hasPose&&trackingState==='TRACKING'){
  const speed=velocity.length(),dt=Math.max(.001,delta);const amount=alpha(1+.007*speed,dt),rotAmount=alpha(1+.007*angularSpeed,dt);
  poseRoot.position.lerp(desiredPosition,amount);poseRoot.quaternion.slerp(desiredRotation,rotAmount);poseRoot.scale.lerp(desiredScale,amount)
 }else if(hasPose&&(trackingState==='EXTRAPOLATING'||trackingState==='LOST')){
  const elapsed=Math.max(0,(performance.now()-lossTime)/1000),prediction=Math.min(elapsed,.35);
  poseRoot.position.copy(lossPosition).addScaledVector(lossVelocity,prediction);
  predictedQuat.setFromAxisAngle(angularAxis,lossAngular*prediction);poseRoot.quaternion.copy(lossRotation).multiply(predictedQuat).normalize();
  if(elapsed>=.35){record('LOST');setOpacity(Math.max(0,1-(elapsed-.35)/.2));if(elapsed>=.55)poseRoot.visible=false}
 }
 if(mixer)mixer.update(delta);renderer.render(scene,camera);
 });showStatus()}catch(e){console.error(e);statusBox.hidden=false;status.textContent='Camera unavailable. Allow access in Safari and retry.';retry.hidden=false}}
retry.addEventListener('click',()=>location.reload());window.addEventListener('pagehide',()=>{if(running){renderer.setAnimationLoop(null);try{ar.stop()}catch(e){}running=false}});window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});load(0);start();
</script></body></html>
